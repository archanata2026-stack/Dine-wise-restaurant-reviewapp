{% extends 'base.html' %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="container" style="max-width:400px; margin-top:40px;">
    <h2>Log In</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Log In</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
</div>
{% endblock %}
