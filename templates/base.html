<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DineWise{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a href="{% url 'restaurant_list' %}" class="logo">
            <img src="{% static 'images/img.png' %}" alt="dinewise logo" class="logo-img">
            DineWise</a>
        <div class="user-info">
    {% if user.is_authenticated %}
        <img src="{{ user.profile.picture.url }}" class="avatar" alt="{{ user.username }}'s profile picture">
        <span class="username">{{ user.username }}</span>
            <a href="{% url 'edit_profile' %}" class="btn btn-sm btn-outline-light">Edit</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
        </form>
    {% else %}
        <div class="avatar"></div>
        <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-sm btn-outline-light">Sign Up</a>
    {% endif %}
</div>
    </header>

    <nav class="site-nav">
        <a href="{% url 'restaurant_list' %}">Home</a>
        <a href="{% url 'cuisine_list' %}">Cuisine</a>
        <a href="{% url 'restaurant_list' %}?sort=rating">Ratings</a>
        <a href="{% url 'restaurant_list' %}#filter-form">Filter</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
